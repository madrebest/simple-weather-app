<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
       <script src="simple-weather-app/script.js"defer></script>
       
        <link rel="stylesheet" href="styles.css">

      </head>
<body>
  <div class="container">
    <main class="main-weather-app">
        <div class="dash-header"><h1>some city</h1>
          
           <div class="temp-row-display">
                    <span class="displayed-temp">+20</span><span class="unit">℃</span>
                </div>
          
            
          <p class="day-text">Monday</p>
        </div>
    
     <div class="Weather-center-body">
    <ul class="collection-item">
        
          <li><i class="fa-solid fa-gauge-high"></i><span>50%</span></li>
           
           <li><i class="fa-solid fa-cloud"></i><span>East, 20km/h</span></li>
            <li><i class="fa-snowflake" ></i><span>1010 hPa</span></li>
    </ul>
       <h2 class="weather-icon-container">
        <i class="fa-solid fa-cloud-sun condition-large-icon" id="main-icon"></i>
       </h2>
          </div>

           <div class="inline-form" style="position: relative; display: flex; align-items: center; margin-bottom: 15px;">
    <input type="text" id="cityInput" placeholder="Enter city..." style="width: 100%; padding: 10px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: #fff; outline: none;">
    <button id="submitButton" style="position: absolute; right: 5px; background: #38bdf8; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: #fff; font-weight: bold;">Go</button>
</div>
        
<section class="forecast-timeline" id="forecast-container">

    <div class="forecast-item">
          <i class="fa-solid fa-cloud-showers-heavy"></i>
        
          <p class="day-text">SUN</p>
          <span class="displayed-temperature">+28</span><span class="units">℃</span>
          </div>

    <div class="forecast-item">
          <i class="fa-solid fa-cloud-bolt"></i>
       
          <p class="day-text">MON</p>
          <span class="displayed-temperature">+25</span><span class="units">℃</span>
           </div>
          <div class="forecast-item">
          <i class="fa-solid fa-snowflake"></i>
        
          <p class="day-text">TUE</p>
          <span class="displayed-temperature">+19</span><span class="units">℃</span>
           </div>
          <div class="forecast-item">
          <i class="fa-solid fa-eye"></i>
        
          <p class="day-text">WED</p>
          <span class="displayed-temperature">+15</span><span class="units">℃</span>
            </div>
          <div class="forecast-item">
          <i class="fa-solid fa-cloud"></i>
        
          <p class="day-text">THU</p>
          <span class="displayed-temperature">+10</span><span class="units">℃</span>
          </div>
          <div class="forecast-item">
          <i class="fa-solid fa-gauge-high"></i>
        
          <p class="day-text">FRI</p>
          <span class="displayed-temperature">+8</span><span class="units">℃</span>
           </div>
          <div class="forecast-item">
          <i class="fa-solid fa-cloud-sun"></i>
        
          <p class="day-text">SAT</p>
           <div class="forecast-temp-wrapper">
          <span class="displayed-temperature">+20</span><span class="units">℃</span>
            </div>
         
      </section>
    </main>
    </div>
        
</body>
</html>
